<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
     <script type="text/javascript">
        var studentId = 0;
        async function deleteStudent(){
              var r = confirm("Do You want to delete This Record ?");
              if(r){
                   let response = await fetch("http://localhost:3000/api/students/delete/"+studentId,{
                    method:'DELETE'
                   });
                   response = await response.json();
                   alert(response.message);     
              } 
        }
        async function updateStudent(){
             var data = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value
                
             } ;
             console.log(data,studentId);
             let response = await fetch("http://localhost:3000/api/students/update/"+studentId,{
                method:'PUT',
                headers:{
                    'Content-Type':'application/json'
                },
                body: JSON.stringify(data)
             });
             response = await response.json();
             console.log(response);
             alert(response.message);
        }
        async function showStudent(id){
            console.log(id);
            let student = await fetch("http://localhost:3000/api/students/show/"+id);
            student = await student.json();
            console.log(student);
            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            studentId = id;
            document.getElementById("s2").style.display='block';
            document.getElementById("s1").style.display='none';
               
        }
           async function allStudents(){
              

               let students = await fetch("http://localhost:3000/api/students/all");
               students = await students.json();
               console.log(students);
               var strContent=`
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name:</th>
                            <th>Email:</th>
                        </tr>
                        </thead>
                        <tbody>
               `;
               for(let student of students){
                   strContent+=`
                    <tr>
                        <td><input type='radio' name='r1' onclick="showStudent(${student.id})"/></td>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                    </tr>
                   `;
               }
               strContent+=`</tbody></table>`;
               document.getElementById("d1").innerHTML=strContent;
               document.getElementById("s2").style.display='none';
               document.getElementById("s1").style.display='block'; 
            }
         async function addStudent(event){
              event.preventDefault();
              var data = {
                'name':document.getElementById("name").value,
                'email':document.getElementById("email").value
              };
              console.log(data);
              let response = await fetch("http://localhost:3000/api/students/add",{
                method:'POST',
                headers:{
                    "Content-type":"application/json"
                },
                body:JSON.stringify(data)
              })
              response = response.json();
              console.log(response);
         }    
        addEventListener("load",allStudents());   
    </script>
    <!-- Your JavaScript goes here (same functions) -->
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-5 py-5">
            <h1 class="text-3xl font-bold">🎓 Student Management System</h1>
            <p class="text-blue-100 mt-1">
                Manage Students with FastAPI + JavaScript
            </p>
        </div>
    </header>

    <!-- Main -->
    <div class="max-w-7xl mx-auto p-5">

        <div class="grid lg:grid-cols-3 gap-6">

            <!-- Student List -->
            <div class="lg:col-span-2">

                <div class="bg-white rounded-xl shadow-lg">

                    <div class="border-b p-5">
                        <h2 class="text-xl font-bold text-gray-700">
                            Student List
                        </h2>
                    </div>

                    <div class="overflow-x-auto">

                        <div id="d1"></div>

                    </div>

                </div>

            </div>

            <!-- Form -->
            <div>

                <div class="bg-white rounded-xl shadow-lg p-6">

                    <h2 class="text-xl font-bold text-gray-700 mb-5">
                        Student Details
                    </h2>

                    <form onsubmit="addStudent(event)" class="space-y-5">

                        <div>

                            <label class="block font-semibold mb-2">
                                Student Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                required
                                placeholder="Enter student name"
                                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            >

                        </div>

                        <div>

                            <label class="block font-semibold mb-2">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                required
                                placeholder="Enter email"
                                class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            >

                        </div>

                        <!-- Submit -->
                        <div id="s1">

                            <button
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300">
                                Add Student
                            </button>

                        </div>

                        <!-- Update/Delete -->
                        <div id="s2" class="hidden">

                            <div class="grid grid-cols-2 gap-3">

                                <button
                                    type="button"
                                    onclick="updateStudent()"
                                    class="bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold transition">

                                    Update

                                </button>

                                <button
                                    type="button"
                                    onclick="deleteStudent()"
                                    class="bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition">

                                    Delete

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <footer class="bg-gray-900 text-white mt-10">

        <div class="max-w-7xl mx-auto px-5 py-5 text-center">

            © 2026 Student Management System |
            Powered by FastAPI & Tailwind CSS

        </div>

    </footer>

</body>
</html>
