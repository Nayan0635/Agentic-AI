
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction</title>

    <script type="text/javascript">

        async function handleSubmit(event) {

            // Turned off page loading
            event.preventDefault();

            const car_age = document.getElementById("car_age").value;
            const mileage = document.getElementById("mileage").value;

            var dataToSubmit = {
                car_age,
                mileage
            };

            console.log(dataToSubmit);

            let response = await fetch("http://localhost:3000/calculate", {
                headers: {
                    "Content-Type": "application/json"
                },
                method: 'POST',
                body: JSON.stringify(dataToSubmit)
            });

            response = await response.json();

            console.log(response);

            document.getElementById("result").innerHTML = `
                <p>Car Age: ${car_age} Years</p>
                <p>Mileage: ${mileage}</p>
                <p>Predicted Car Price: ${response.newPrice}</p>
            `;
        }

    </script>
</head>

<body>

    <h1>Car Price Calculator</h1>

    <form onsubmit="handleSubmit(event)">

        Car Age:
        <input type="number" id="car_age" required>

        <br><br>

        Mileage:
        <input type="number" id="mileage" required>

        <br><br>

        <button type="submit">Calculate</button>
        <button type="reset">Reset</button>

    </form>

    <div id="result"></div>

</body>
</html>
